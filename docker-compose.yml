version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The backend's boot seed runs a query immediately and dies if the DB refuses it
    # (troubleshooting #23). After an unclean shutdown Postgres spends several seconds in
    # crash recovery answering `FATAL: the database system is starting up`, so "container
    # started" is not the signal the backend needs — "accepting connections" is.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # NOTE: backend and frontend are OPT-IN (`profiles: [docker]`), so a plain
  # `docker compose up -d` starts db + redis ONLY. That matches the stack's actual
  # design (scripts/taskhub.ps1): Postgres/Redis in Docker, backend + frontend + agent
  # as host processes. Running both copies at once is what caused troubleshooting #23 —
  # the container grabbed :3000, the host backend then couldn't bind it, and when the
  # container crashed the port was held by a dead process. Run the containerized
  # variant explicitly instead:  docker compose --profile docker up -d
  backend:
    profiles: ["docker"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskhub:password@db:5432/taskhub
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # The backend fail-fasts without these. Values below are DEV-ONLY defaults so
      # `docker compose up` boots out of the box; override them (host env or a root
      # .env) for anything real. JWT_SECRET must be >= 16 chars, ENCRYPTION_KEY
      # EXACTLY 32, AGENT_PAIRING_SECRET >= 16 and matched by the agent's
      # TASKHUB_PAIRING_SECRET (see docs/setup/README.md).
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_32_chars_1234}
      AGENT_PAIRING_SECRET: ${AGENT_PAIRING_SECRET:-dev-pairing-secret-change-me}
      # Frontend origin(s) allowed to open the browser live-update socket.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7373}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    profiles: ["docker"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "7373:7373"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
