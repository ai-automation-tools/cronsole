# Mirror the gallery page to Cronsole's public front door, on the merge that
# changes it.
#
# The same registry-site/index.html is served from TWO hosts with different
# jobs: mikesailab.com/cronsole-registry (beside the registry JSON it reads) and
# cronsole.ai-automation-tools.dev (the front door, on the org's own domain since
# 2026-09-13, and the ONLY front door since 2026-10-23). publish-registry.yml
# handles the first; the job below handles the second.
#
# A third host, cronsole.mikesailab.com (michaelschecht/cronsole-site), was
# retired on 2026-10-23. It now redirects to the org site and nothing here
# publishes to it -- do not add it back.
#
# The set exists so "one page, N hosts" cannot quietly become one page, one host
# and N-1 stale copies -- which is what happened whenever someone ran one publish
# script and not the other. The stale half is always whichever one you did not
# happen to open, so every host gets a job and every host gets a drift check.
#
# The page is built to work at both addresses: it tries ./index.json first and
# falls back to the canonical registry origin when it is not co-located (GitHub
# Pages sends Access-Control-Allow-Origin: *).
name: Publish front door

on:
  push:
    branches: [main]
    paths:
      - 'registry-site/**'
      - '.github/workflows/publish-frontdoor.yml'
  workflow_dispatch:

concurrency:
  group: publish-frontdoor
  cancel-in-progress: false

jobs:
  publish-org:
    name: Mirror the gallery page to the front door
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cronsole (source of truth)
        uses: actions/checkout@v4
        with:
          path: source

      # This job used to SKIP when its secret was missing, because the org once
      # disabled deploy keys by policy and the personal host was the load-bearing
      # one. Neither holds any more: SITE_ORG_DEPLOY_KEY has been set since
      # 2026-09-13 and this is now the only front door, so a missing key is an
      # outage, not a pending setup step. Fail loudly.
      - name: Require the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SITE_ORG_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::SITE_ORG_DEPLOY_KEY is not set, so cronsole.ai-automation-tools.dev was NOT updated. Add a deploy key with write access to ai-automation-tools/cronsole-site as a repository secret -- see docs/install/guides/Registry_Publishing_Guide.md"
            exit 1
          fi

      - name: Checkout the org front door (publish target)
        uses: actions/checkout@v4
        with:
          repository: ai-automation-tools/cronsole-site
          ssh-key: ${{ secrets.SITE_ORG_DEPLOY_KEY }}
          path: target

      # The custom domain lives or dies by this file, and it is NOT mirrored from
      # here -- it is infrastructure owned by the target repo, not content.
      # Publishing over a repo whose CNAME is absent produces a page nobody can
      # reach at the documented address, and the push itself would succeed.
      - name: Check the custom domain is still configured
        run: |
          set -euo pipefail
          if [ ! -f target/CNAME ]; then
            echo "::error::No CNAME in ai-automation-tools/cronsole-site -- cronsole.ai-automation-tools.dev will not serve this."
            exit 1
          fi
          echo "Custom domain: $(cat target/CNAME)"

      # Copy every flat file in registry-site/, not just index.html, so adding CSS
      # or JS later reaches BOTH hosts (publish-registry.yml does the same).
      # README.md and CNAME belong to the target repo.
      - name: Mirror the gallery page
        run: |
          set -euo pipefail
          test -f source/registry-site/index.html || {
            echo "::error::registry-site/index.html is missing -- the front door would 404"
            exit 1
          }
          find source/registry-site -maxdepth 1 -type f \
            ! -name 'README.md' ! -name 'CNAME' \
            -exec cp {} target/ \;

      - name: Commit and push if changed
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Org front door already up to date -- nothing to publish.'
            exit 0
          fi
          git commit -q -m "Publish front door (cronsole@${GITHUB_SHA:0:7})"
          git push -q origin HEAD:main
          echo "Published. GitHub Pages will rebuild shortly (https://$(cat CNAME))."
