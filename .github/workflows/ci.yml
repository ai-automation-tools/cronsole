name: CI

on:
  push:
    branches:
      - main
      - mike_desktop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene (no binary-classified text)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A stray control byte (NUL, 0x1f, …) makes git treat a text file as
      # binary, so its diff can't be reviewed — a silent failure that only bites
      # the reviewer. This guard makes the class impossible to reintroduce.
      - name: Check for literal control bytes in text files
        run: node scripts/check-control-bytes.mjs

      # Windows PowerShell 5.1 reads .ps1 as ANSI unless the file has a UTF-8 BOM,
      # so one em-dash in a comment produces PARSE ERRORS on correct syntax. pwsh 7
      # parses it fine, which is why five scripts — including a machine migration and
      # the elevated agent installer — were unrunnable in "Windows PowerShell (Admin)"
      # for months with every check green.
      - name: Check PowerShell scripts are pure ASCII
        run: node scripts/check-ps1-ascii.mjs

      # A broken doc link does not 404 — GitHub serves the page scrolled to the
      # top — so a renamed heading silently starts delivering the wrong section
      # and nothing anywhere reddens. The TaskHub rename left 13 such links dead
      # across CHANGELOG and troubleshooting, undetected through every green CI
      # run from 2026-07-31 to 2026-08-17. This checks doc -> doc; the app's own
      # links are covered separately by frontend docsLinks.test.ts.
      - name: Check documentation links resolve
        run: node scripts/check-doc-links.mjs

      # Warns, never fails: rebuilding needs Chrome + Archify, which CI doesn't have. A
      # warning means code cited by docs/diagrams/source-data-flow.json changed since its
      # pinned commit; docs/diagrams/README.md says how to update it.
      - name: Diagram drift
        run: node scripts/build-diagram.mjs --hook | sed 's/^ISSUE:/::warning title=Diagram drift::ISSUE:/'

      # `.gitignore` denies `.env*` and re-includes three examples plus
      # frontend/.env.remote, which is a real build input holding one public routing
      # value. Nothing stopped that file - or an example - from later gaining a live
      # credential in a one-line diff to a file git had been carrying for months.
      # A 2026-08-23 audit flagged the shape here and found it already realised one
      # repo over (a Neon admin connection string committed in a migration write-up).
      - name: Check tracked .env files are allowlisted and secret-free
        run: node scripts/check-tracked-env.mjs

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history: a secret removed in a later commit is still published.
          fetch-depth: 0

      # The env-file check above reads two populations by provider pattern. This reads
      # every commit, including generic high-entropy assignments. A reviewed false
      # positive goes in .gitleaksignore with the reason beside it. Values are redacted
      # because this log is public. Image pinned; never :latest.
      - name: Scan the git history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          git /repo --no-banner --redact=100

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Shipped dependencies only, high and critical only: a dev-tool advisory would
      # redden every unrelated pull request and teach people to ignore the job.
      - name: Audit shipped dependencies
        run: |
          for dir in backend frontend mcp-server; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  backend-integration:
    name: Backend integration tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # DB identity stays `taskhub` on purpose (compose pins `name: taskhub` for the
          # same reason). A rename pass moved these three to `cronsole` while the stage-1
          # protection list held TEST_DATABASE_URL below at `taskhub` — so CI created one
          # role and the tests connected as another. Keep both halves on `taskhub`.
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        # NOTE: pg_isready ignores -U/-d when deciding its exit code -- it answers
        # "is the server accepting connections", not "can this role reach this db",
        # and returns 0 for a role that does not exist. That is why this job went red
        # at the test step rather than at the healthcheck.
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # globalSetup creates taskhub_test on this server and migrates it.
      TEST_DATABASE_URL: postgresql://taskhub:password@localhost:5432/taskhub_test
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      AGENT_PAIRING_SECRET: 'ci-agent-pairing-secret-not-real'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-agent:
    name: Windows agent build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore agent dependencies
        run: dotnet restore

      - name: Build agent
        run: dotnet build --configuration Release --no-restore

      - name: Run agent tests
        run: dotnet test --configuration Release --no-build

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run MCP server tests
        run: npm test

      # vitest transpiles without typechecking, and the build config excludes
      # src/__tests__ (emitting tests into dist/ would publish them) — so this
      # is the only thing that typechecks the suite.
      - name: Typecheck MCP server (incl. tests)
        run: npm run typecheck

      - name: Build MCP server
        run: npm run build

  e2e:
    name: Browser tests (Playwright, real stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taskhub:password@localhost:5432/taskhub
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      AGENT_PAIRING_SECRET: 'ci-agent-pairing-secret-not-real'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # `predev` applies the migrations; boot creates the placeholder user and the catalog.
      - name: Start the backend
        working-directory: backend
        run: nohup npm run dev > ../backend.log 2>&1 &

      - name: Install frontend dependencies and the browser
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      # A fresh database shows the first-run screen whatever token the page holds, so
      # create the owner first. The request is a direct loopback one: no setup code.
      # The token is minted afterwards, because a password change ends older sessions.
      - name: Create the owner and mint the page's token
        working-directory: backend
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && break; sleep 2; done
          curl -sf -o /dev/null -X POST http://127.0.0.1:3000/api/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-not-real"}'
          sleep 1
          TOKEN=$(node --input-type=module -e "import jwt from 'jsonwebtoken'; console.log(jwt.sign({ id: 'cli_user_placeholder', email: 'ci@example.com' }, process.env.JWT_SECRET, { expiresIn: '1h' }))")
          echo "::add-mask::$TOKEN"
          echo "VITE_DEV_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Start the dashboard
        working-directory: frontend
        run: |
          nohup npm run dev > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7373/ > /dev/null && break; sleep 2; done

      # Left out: layout.spec.ts (its screenshots are Windows baselines) and
      # mock-agent.spec.ts (it expects a Windows connection a fresh database does not have).
      - name: Run the browser tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:7373
        # One worker: the empty-dashboard test needs a moment when no other spec
        # has a task in the database, and skips itself otherwise.
        run: npx playwright test smoke native-job-env a11y --workers=1

      - name: Show server logs and failure snapshots
        if: failure()
        run: |
          echo "--- backend ---";  tail -n 80 backend.log || true
          echo "--- frontend ---"; tail -n 40 frontend.log || true
          find frontend/test-results -name 'error-context.md' -exec sh -c 'echo "--- $1 ---"; head -c 4000 "$1"' _ {} \; || true
