# Publish the template registry AND the gallery page to Cronsole's one public
# host, ai-automation-tools/cronsole-site (https://cronsole.ai-automation-tools.dev/),
# on the merge that changes either.
#
# Why this exists: registry/ is drift-tested, so an *unbuilt* artifact reddens
# CI. Nothing caught an *unpublished* one. The hosted registry and the gallery
# page are read by other people's machines, so the gap between "merged" and
# "published" was a window where main told one story and the public URL told an
# older one.
#
# One workflow, ONE job, on purpose (2026-10-23). The registry used to live on a
# separate personal repo (michaelschecht/cronsole-registry, served at
# mikesailab.com/cronsole-registry/) with its own workflow, and the page went to
# the org site from a second one. Since the registry moved onto the org site,
# both write the same repo -- and two jobs pushing the same branch race: the
# loser's push is rejected, or worse, each clone's wholesale copy is computed
# from a tree the other is about to change. One job, one checkout, one commit.
#
# Nothing pushes to michaelschecht/cronsole-registry any more. It is archived as
# a frozen snapshot so pre-2026-10-23 opted-in installs do not 404 -- do not add
# it back as a target.
#
# The local script (scripts/publish-registry.ps1) does the same mirroring by
# hand. registry-drift.yml + frontdoor-drift.yml are the backstops that catch
# THIS workflow failing quietly.
name: Publish registry + front door

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'registry-site/**'
      - '.github/workflows/publish-registry.yml'
  workflow_dispatch:

# Never let two publishes race: the mirror is a wholesale replace, so an
# out-of-order push would serve an older catalog than main. Queue, don't cancel
# -- a cancelled publish is an unpublished one, which is the thing we are fixing.
concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror registry + gallery to cronsole-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cronsole (source of truth)
        uses: actions/checkout@v4
        with:
          path: source

      # This is the only public host, so a missing key is an outage, not a
      # pending setup step. Fail loudly and early rather than at the push step,
      # where the error is an opaque permission denial.
      - name: Require the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SITE_ORG_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::SITE_ORG_DEPLOY_KEY is not set, so cronsole.ai-automation-tools.dev was NOT updated. Add a deploy key with write access to ai-automation-tools/cronsole-site as a repository secret -- see docs/install/guides/Registry_Publishing_Guide.md"
            exit 1
          fi

      - name: Checkout cronsole-site (publish target)
        uses: actions/checkout@v4
        with:
          repository: ai-automation-tools/cronsole-site
          ssh-key: ${{ secrets.SITE_ORG_DEPLOY_KEY }}
          path: target

      # Two pieces of target-owned infrastructure, both checked before copying:
      #  - CNAME decides which domain the repo answers on. Absent, the push
      #    succeeds and nobody can reach the result at the documented address --
      #    and that address is now TEMPLATE_REGISTRY_URL, so it is catalog sync
      #    for every opted-in install, not just a page.
      #  - .gitattributes must keep JSON LF. The index's sha256 is over exact
      #    bytes; a "* text=auto" that let a Windows clone CRLF the templates
      #    would break every checksum. The target currently pins "* text eol=lf".
      - name: Check the target's domain and line-ending pin
        working-directory: target
        run: |
          set -euo pipefail
          if [ ! -f CNAME ]; then
            echo "::error::No CNAME in ai-automation-tools/cronsole-site -- cronsole.ai-automation-tools.dev will not serve this."
            exit 1
          fi
          echo "Custom domain: $(cat CNAME)"
          for f in index.json templates/x.json packs/x.json; do
            eol=$(git check-attr eol -- "$f" | awk '{print $NF}')
            if [ "$eol" != "lf" ]; then
              echo "::error::.gitattributes in cronsole-site does not pin $f to LF (eol: $eol). Registry files are content-addressed -- add '*.json text eol=lf' there first."
              exit 1
            fi
          done

      # Replace index.json + templates/ + packs/ WHOLESALE, so a removed template
      # or pack actually disappears -- a deleted pack that keeps serving its old
      # bundle is a URL that still works and no longer should. Only those three
      # paths are touched; the page files, CNAME, README.md and .gitattributes
      # are left exactly as they are.
      - name: Mirror the generated registry
        run: |
          set -euo pipefail
          test -f source/registry/index.json || {
            echo "::error::source/registry/index.json is missing -- run 'npm run registry:build' in backend/ and commit registry/"
            exit 1
          }
          cp source/registry/index.json target/index.json
          for dir in templates packs; do
            if [ ! -d "source/registry/$dir" ]; then
              echo "::error::source/registry/$dir is missing -- the index would reference paths that 404. Run 'npm run registry:build'."
              exit 1
            fi
            rm -rf "target/$dir"
            cp -r "source/registry/$dir" "target/$dir"
          done

      # The gallery is its own file, not part of the generated JSON artifact, so
      # it lands flat at the clone root beside index.json (which it then reads
      # same-origin). Every flat file is copied, so adding CSS/JS later Just
      # Works. README.md and CNAME belong to the target repo and are excluded.
      - name: Mirror the gallery page
        run: |
          set -euo pipefail
          test -f source/registry-site/index.html || {
            echo "::error::registry-site/index.html is missing -- the front door would 404"
            exit 1
          }
          find source/registry-site -maxdepth 1 -type f \
            ! -name 'README.md' ! -name 'CNAME' \
            -exec cp {} target/ \;

      - name: Commit and push if changed
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'cronsole-site already up to date -- nothing to publish.'
            exit 0
          fi
          git commit -q -m "Publish registry + front door (cronsole@${GITHUB_SHA:0:7})"
          git push -q origin HEAD:main
          echo "Published. GitHub Pages will rebuild shortly (https://$(cat CNAME)/)."
