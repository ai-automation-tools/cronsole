name: CI

on:
  push:
    branches:
      - main
      - mike_desktop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo hygiene (no binary-classified text)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A stray control byte (NUL, 0x1f, …) makes git treat a text file as
      # binary, so its diff can't be reviewed — a silent failure that only bites
      # the reviewer. This guard makes the class impossible to reintroduce.
      - name: Check for literal control bytes in text files
        run: node scripts/check-control-bytes.mjs

      # Windows PowerShell 5.1 reads .ps1 as ANSI unless the file has a UTF-8 BOM,
      # so one em-dash in a comment produces PARSE ERRORS on correct syntax. pwsh 7
      # parses it fine, which is why five scripts — including a machine migration and
      # the elevated agent installer — were unrunnable in "Windows PowerShell (Admin)"
      # for months with every check green.
      - name: Check PowerShell scripts are pure ASCII
        run: node scripts/check-ps1-ascii.mjs

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  backend-integration:
    name: Backend integration tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # DB identity stays `taskhub` on purpose (compose pins `name: taskhub` for the
          # same reason). A rename pass moved these three to `cronsole` while the stage-1
          # protection list held TEST_DATABASE_URL below at `taskhub` — so CI created one
          # role and the tests connected as another. Keep both halves on `taskhub`.
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        # NOTE: pg_isready ignores -U/-d when deciding its exit code -- it answers
        # "is the server accepting connections", not "can this role reach this db",
        # and returns 0 for a role that does not exist. That is why this job went red
        # at the test step rather than at the healthcheck.
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # globalSetup creates taskhub_test on this server and migrates it.
      TEST_DATABASE_URL: postgresql://taskhub:password@localhost:5432/taskhub_test
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      AGENT_PAIRING_SECRET: 'ci-agent-pairing-secret-not-real'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-agent:
    name: Windows agent build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore agent dependencies
        run: dotnet restore

      - name: Build agent
        run: dotnet build --configuration Release --no-restore

      - name: Run agent tests
        run: dotnet test --configuration Release --no-build

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run MCP server tests
        run: npm test

      # vitest transpiles without typechecking, and the build config excludes
      # src/__tests__ (emitting tests into dist/ would publish them) — so this
      # is the only thing that typechecks the suite.
      - name: Typecheck MCP server (incl. tests)
        run: npm run typecheck

      - name: Build MCP server
        run: npm run build
