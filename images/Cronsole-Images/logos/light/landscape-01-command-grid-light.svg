  <circle cx="128" cy="180" r="18" fill="#059669"/>
  <circle cx="210" cy="180" r="15" fill="#8b5cf6"/>
  <circle cx="128" cy="228" r="18" fill="#059669"/>
  <circle cx="170" cy="228" r="15" fill="#8b5cf6"/>
  <path d="M200 238l22 22 43-58" fill="none" stroke="#111827" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="344" y="177" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="0">Cronsole</text>
  <text x="350" y="232" fill="#52525b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="0">One control plane for scheduled tasks</text>
  <g transform="translate(938 124)">
