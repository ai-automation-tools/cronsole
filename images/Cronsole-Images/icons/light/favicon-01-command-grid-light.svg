<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">TaskHub Command Grid light favicon concept</title>
  <desc id="desc">A light square TaskHub icon showing connected task nodes inside a crisp control-plane tile.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="48" x2="200" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <path d="M76 94h104M76 128h104M76 162h104" stroke="#d4d4d8" stroke-width="16" stroke-linecap="round"/>
  <path d="M76 94h54M76 128h82M76 162h42" stroke="#7c3aed" stroke-width="16" stroke-linecap="round"/>
  <circle cx="76" cy="94" r="18" fill="#059669"/>
  <circle cx="130" cy="94" r="15" fill="#8b5cf6"/>
  <circle cx="76" cy="128" r="18" fill="#059669"/>
  <circle cx="158" cy="128" r="15" fill="#8b5cf6"/>
  <circle cx="76" cy="162" r="18" fill="#059669"/>
  <circle cx="118" cy="162" r="15" fill="#8b5cf6"/>
  <path d="M146 172l22 22 43-58" fill="none" stroke="#111827" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
