<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cronsole Command Grid light landscape logo concept</title>
  <desc id="desc">A wide light Cronsole wordmark with a connected task grid icon for GitHub and website headers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="70" x2="286" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="40" fill="url(#bg)"/>
  <rect x="72" y="72" width="216" height="216" rx="46" fill="#ffffff" stroke="url(#accent)" stroke-width="8"/>
  <path d="M128 132h104M128 180h104M128 228h104" stroke="#d4d4d8" stroke-width="16" stroke-linecap="round"/>
  <path d="M128 132h54M128 180h82M128 228h42" stroke="#7c3aed" stroke-width="16" stroke-linecap="round"/>
  <circle cx="128" cy="132" r="18" fill="#059669"/>
