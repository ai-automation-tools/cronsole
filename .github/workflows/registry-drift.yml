# Is the hosted registry actually serving what main says it should?
#
# The registry is served from https://cronsole.ai-automation-tools.dev/ (since
# 2026-10-23; the old mikesailab.com/cronsole-registry/ is a frozen, archived
# snapshot and is not checked). The backstop for publish-registry.yml. That workflow can fail in ways that do
# not redden anything a person looks at: a revoked deploy key, a path filter
# that stops matching, a run that never triggered. Every one of those failure
# modes looks exactly like "nobody changed the registry lately" from inside the
# repo, because the committed artifact is still correct -- it is the CDN that is
# behind, and no test in the suite can see the CDN.
#
# So this asks the only question that matters, on a schedule, against the real
# public URL. It reports; it does not repair.
name: Registry drift

on:
  schedule:
    # 13:10 UTC daily. Offset off the hour because GitHub queues scheduled jobs
    # hardest on the hour, and a delayed drift check is a check that reports
    # yesterday.
    - cron: '10 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Hosted registry matches main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the failure-issue step below
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare the hosted registry against the committed artifact
        run: node scripts/check-registry-published.mjs

      # While this workflow is red it keeps one open issue (label workflow-failure) up to date;
      # the first green run closes it. A cancelled run does neither.
      - name: Open, update or close the failure issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          TITLE: "Scheduled workflow failing: ${{ github.workflow }}"
        run: |
          [ "$OUTCOME" = cancelled ] && exit 0
          gh label create workflow-failure --color d73a4a --description "A scheduled workflow is failing" 2>/dev/null || true
          issue=$(gh issue list --label workflow-failure --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$OUTCOME" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Green again: $RUN_URL"; fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label workflow-failure --body "The scheduled workflow \`$GITHUB_WORKFLOW\` failed. Run: $RUN_URL"
          fi
