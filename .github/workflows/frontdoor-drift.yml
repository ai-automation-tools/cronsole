# Does the public host serve the gallery page that is on main?
#
# The sibling of registry-drift.yml, for the other published surface. Both now
# live on one host (cronsole.ai-automation-tools.dev, published by one job in
# publish-registry.yml since 2026-10-23), but they stay separate checks because
# they answer different questions and fail for different reasons: that one
# compares a content-addressed JSON artifact, this one compares rendered HTML
# bytes. A single red "drift" check covering both would need reading twice to
# learn which surface is wrong. The retired hosts (cronsole.mikesailab.com, a
# redirect; mikesailab.com/cronsole-registry/, a frozen snapshot) are not
# checked.
name: Front door drift

on:
  schedule:
    # 13:20 UTC daily, ten minutes behind the registry check, so if a bad
    # publish breaks both the notifications arrive in a readable order rather
    # than as two simultaneous failures.
    - cron: '20 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: The front door serves the current gallery page, and its catalogs load
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the failure-issue step below
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare the host against the committed page
        run: node scripts/check-frontdoor-published.mjs

      # The page also advertises the other repos' catalogs in EXTERNAL_SOURCES (since 2026-11-10).
      # Their own drift checks cannot see what only this page needs: CORS, and no id clash with ours.
      # It also probes every public org repo's homepage for a catalog the list does not name.
      - name: The other catalogs the page lists still load, and none is missing from it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-catalogs.mjs

      # While this workflow is red it keeps one open issue (label workflow-failure) up to date;
      # the first green run closes it. A cancelled run does neither.
      - name: Open, update or close the failure issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          TITLE: "Scheduled workflow failing: ${{ github.workflow }}"
        run: |
          [ "$OUTCOME" = cancelled ] && exit 0
          gh label create workflow-failure --color d73a4a --description "A scheduled workflow is failing" 2>/dev/null || true
          issue=$(gh issue list --label workflow-failure --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$OUTCOME" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Green again: $RUN_URL"; fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label workflow-failure --body "The scheduled workflow \`$GITHUB_WORKFLOW\` failed. Run: $RUN_URL"
          fi
