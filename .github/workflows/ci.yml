name: CI

on:
  push:
    branches:
      - main
      - mike_desktop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  backend-integration:
    name: Backend integration tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # globalSetup creates taskhub_test on this server and migrates it.
      TEST_DATABASE_URL: postgresql://taskhub:password@localhost:5432/taskhub_test
      JWT_SECRET: 'ci-jwt-secret-not-for-production-use'
      ENCRYPTION_KEY: '12345678901234567890123456789012'
      AGENT_PAIRING_SECRET: 'ci-agent-pairing-secret-not-real'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-agent:
    name: Windows agent build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore agent dependencies
        run: dotnet restore

      - name: Build agent
        run: dotnet build --configuration Release --no-restore

      - name: Run agent tests
        run: dotnet test --configuration Release --no-build
