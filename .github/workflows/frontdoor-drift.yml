# Does the public host serve the gallery page that is on main?
#
# The sibling of registry-drift.yml, for the other published surface. Both now
# live on one host (cronsole.ai-automation-tools.dev, published by one job in
# publish-registry.yml since 2026-10-23), but they stay separate checks because
# they answer different questions and fail for different reasons: that one
# compares a content-addressed JSON artifact, this one compares rendered HTML
# bytes. A single red "drift" check covering both would need reading twice to
# learn which surface is wrong. The retired hosts (cronsole.mikesailab.com, a
# redirect; mikesailab.com/cronsole-registry/, a frozen snapshot) are not
# checked.
name: Front door drift

on:
  schedule:
    # 13:20 UTC daily, ten minutes behind the registry check, so if a bad
    # publish breaks both the notifications arrive in a readable order rather
    # than as two simultaneous failures.
    - cron: '20 13 * * *'
  workflow_dispatch:

jobs:
  drift:
    name: The front door serves the current gallery page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare the host against the committed page
        run: node scripts/check-frontdoor-published.mjs
