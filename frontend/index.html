<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <meta name="description" content="Cronsole — a single pane of glass for viewing, triggering, and managing scheduled tasks across Windows Task Scheduler, Claude routines, and more." />
    <title>Cronsole</title>
    <!-- A file, not inline: the proxy's Content-Security-Policy allows scripts from
         this origin only. Blocking on purpose, so the theme is set before first paint. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <!-- Painted before the JS bundle arrives (~1s); React replaces it on mount.
         Neutral grey on purpose: index.css's theme tokens are not loaded yet, and
         the same mid-grey reads on every palette. -->
    <style>
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
      #boot i{width:24px;height:24px;border-radius:50%;border:2px solid rgba(128,128,128,.3);border-top-color:rgba(128,128,128,.9);animation:boot .8s linear infinite}
      @keyframes boot{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#boot i{animation-duration:3s}}
    </style>
    <div id="root"><div id="boot" aria-label="Loading Cronsole" role="status"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/consent-gate.js"></script>
  </body>
</html>
