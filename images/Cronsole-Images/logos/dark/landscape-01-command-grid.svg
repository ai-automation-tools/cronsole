    </linearGradient>
    <linearGradient id="accent" x1="78" y1="70" x2="286" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="40" fill="url(#bg)"/>
  <rect x="72" y="72" width="216" height="216" rx="46" fill="#09090b" stroke="url(#accent)" stroke-width="8"/>
  <path d="M128 132h104M128 180h104M128 228h104" stroke="#27272a" stroke-width="16" stroke-linecap="round"/>
  <path d="M128 132h54M128 180h82M128 228h42" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
